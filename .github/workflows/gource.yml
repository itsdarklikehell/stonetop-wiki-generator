name: Gource video

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gource:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Gource
        run: sudo apt-get update && sudo apt-get install -y gource ffmpeg

      - name: Generate Gource video
        run: |
          gource \
            -1280x720 \
            --output-ppm-stream - \
            --output-framerate 30 \
            --stop-at-time 30 \
            --seconds-per-day 60 \
            --auto-skip-seconds 0.5 \
            --hide filenames \
            --hide files \
            --file-idle-time 0 \
            --file-filter "/(extracted|generator|pages|Stonetop_Wiki|i18n|sync-worker|tests|\.py|\.md|\.txt|\.yml|\.yaml|\.gitignore|\.gitattributes|LICENSE|requirements\.txt|stonetop-wiki-generator\.py)/" \
            | ffmpeg -y \
              -r 30 \
              -f image2pipe \
              -vcodec ppm \
              -i - \
              -c:v libx264 \
              -preset fast \
              -crf 23 \
              -pix_fmt yuv420p \
              gource.mp4

      - name: Commit and push Gource video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4
          git commit -m "Update Gource video [skip ci]" || echo "No changes to commit"
          git push
